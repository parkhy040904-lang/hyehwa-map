<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#fdf6f0">
<title>혜화 공연 지도 🎭</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  :root {
    --bg:#fdf6f0;--surface:#fffaf6;--card:#fff8f3;--border:#f0e4d8;--border2:#e8d5c4;
    --peach:#f4a58a;--peach-lt:#fde8df;--peach-dk:#e8856a;
    --rose:#f0a0b0;--mint:#8fcfb8;--mint-lt:#dff3ec;
    --lavender:#b8a8d8;--lav-lt:#ede8f8;--butter:#f5d88a;--butter-lt:#fef6dc;
    --sky:#90c8e8;--text:#3a2e28;--text-sub:#8a7060;--text-dim:#c0a898;
    --shadow-sm:0 2px 8px rgba(180,120,80,0.08);--shadow-md:0 4px 20px rgba(180,120,80,0.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif}
  body{display:flex;flex-direction:column;height:100dvh}

  header{background:var(--surface);border-bottom:1.5px solid var(--border);padding:env(safe-area-inset-top,0) 0 0;flex-shrink:0;z-index:100}
  .header-inner{padding:14px 18px 0}
  .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .logo{display:flex;align-items:baseline;gap:6px}
  .logo-title{font-family:'Noto Serif KR',serif;font-size:20px;font-weight:700;color:var(--peach-dk);letter-spacing:-0.5px}
  .logo-sub{font-size:11px;color:var(--text-dim);font-weight:300}
  .date-chip{font-size:11px;color:var(--text-sub);background:var(--peach-lt);border:1px solid var(--border);padding:4px 10px;border-radius:20px;font-weight:500}
  .refresh-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border2);background:var(--card);color:var(--text-sub);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;box-shadow:var(--shadow-sm)}
  .refresh-btn:active{transform:scale(0.92)}
  .refresh-btn.spinning{animation:spin 0.8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .filter-wrap{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 18px 14px}
  .filter-wrap::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;font-size:12px;font-family:'Noto Sans KR',sans-serif;font-weight:500;padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);color:var(--text-sub);cursor:pointer;transition:all 0.18s;white-space:nowrap;box-shadow:var(--shadow-sm)}
  .chip:active{transform:scale(0.95)}
  .chip.active-peach{background:var(--peach);border-color:var(--peach-dk);color:#fff}
  .chip.active-rose{background:var(--rose);border-color:#d87090;color:#fff}
  .chip.active-mint{background:var(--mint);border-color:#6ab09a;color:#fff}
  .chip.active-lavender{background:var(--lavender);border-color:#9878c8;color:#fff}
  .chip.active-butter{background:var(--butter);border-color:#d8b840;color:#7a5a00}

  #map{flex:1;min-height:0;position:relative;z-index:1}

  .map-loading{position:absolute;inset:0;background:rgba(253,246,240,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50;transition:opacity 0.4s}
  .map-loading.hidden{opacity:0;pointer-events:none}
  .loader-wrap{position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
  .loader-ring{width:44px;height:44px;border:3px solid var(--border);border-top-color:var(--peach);border-radius:50%;animation:spin 0.9s linear infinite}
  .loader-emoji{font-size:28px;position:absolute;animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
  .loading-label{font-size:13px;color:var(--text-sub)}

  .sheet{background:var(--surface);border-top:2px solid var(--border);border-radius:24px 24px 0 0;flex-shrink:0;max-height:52vh;overflow-y:auto;scrollbar-width:none;transition:max-height 0.35s cubic-bezier(0.4,0,0.2,1);box-shadow:0 -4px 24px rgba(180,120,80,0.10);padding-bottom:env(safe-area-inset-bottom,0);position:relative;z-index:90}
  .sheet::-webkit-scrollbar{display:none}
  .sheet.collapsed{max-height:54px;overflow:hidden}
  .sheet.collapsed .chevron{transform:rotate(180deg)}
  .sheet-pill{width:36px;height:4px;background:var(--border2);border-radius:2px;position:absolute;top:6px;left:50%;transform:translateX(-50%)}
  .sheet-handle{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px;cursor:pointer;position:sticky;top:0;background:var(--surface);z-index:10;border-bottom:1px solid var(--border);border-radius:24px 24px 0 0}
  .sheet-title-row{display:flex;align-items:center;gap:8px}
  .sheet-title{font-size:14px;font-weight:600;color:var(--text)}
  .count-pill{font-size:11px;font-weight:700;background:var(--peach);color:#fff;padding:2px 8px;border-radius:12px}
  .chevron{font-size:13px;color:var(--text-dim);transition:transform 0.3s}

  .perf-list{padding:6px 0 8px}
  .perf-card{display:flex;align-items:stretch;gap:12px;padding:12px 18px;cursor:pointer;transition:background 0.15s;border-bottom:1px solid var(--border)}
  .perf-card:last-child{border-bottom:none}
  .perf-card:active,.perf-card.highlighted{background:var(--peach-lt)}
  .perf-thumb{width:48px;height:62px;border-radius:10px;flex-shrink:0;background:var(--peach-lt);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden}
  .perf-thumb img{width:100%;height:100%;object-fit:cover}
  .perf-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px}
  .perf-name{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Noto Serif KR',serif}
  .perf-venue{font-size:11px;color:var(--peach-dk);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .perf-tags{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .tag{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:500;border:1px solid transparent}
  .tag-genre{background:var(--lav-lt);color:var(--lavender);border-color:#d8cef0}
  .tag-ongoing{background:var(--mint-lt);color:#4a9a80;border-color:#b8e8d8}
  .tag-upcoming{background:var(--butter-lt);color:#9a7800;border-color:#f0d880}
  .perf-date{font-size:10px;color:var(--text-dim)}

  .empty{text-align:center;padding:32px 24px;color:var(--text-dim)}
  .empty-icon{font-size:36px;margin-bottom:10px}
  .empty-text{font-size:13px;line-height:1.8}

  .toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);left:50%;transform:translateX(-50%) translateY(8px);background:var(--text);color:#fff;font-size:12px;font-weight:500;padding:9px 18px;border-radius:20px;z-index:999;opacity:0;transition:all 0.3s;white-space:nowrap;pointer-events:none;box-shadow:var(--shadow-md)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* Leaflet 팝업 커스텀 */
  .leaflet-popup-content-wrapper{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;box-shadow:var(--shadow-md);padding:0}
  .leaflet-popup-content{margin:12px 14px;font-family:'Noto Sans KR',sans-serif}
  .leaflet-popup-tip{background:var(--surface)}
  .popup-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px;font-family:'Noto Serif KR',serif;line-height:1.4}
  .popup-venue{font-size:11px;color:var(--peach-dk);margin-bottom:3px;font-weight:500}
  .popup-date{font-size:10px;color:var(--text-dim);margin-bottom:6px}
  .popup-status{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:600;display:inline-block}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-top">
      <div class="logo">
        <span class="logo-title">🎭 혜화공연지도</span>
        <span class="logo-sub">대학로</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="date-chip" id="dateChip"></div>
        <button class="refresh-btn" id="refreshBtn" onclick="loadData()">↻</button>
      </div>
    </div>
  </div>
  <div class="filter-wrap">
    <button class="chip active-peach" data-genre="전체" onclick="setGenre(this)">전체</button>
    <button class="chip" data-genre="연극" onclick="setGenre(this)">🎭 연극</button>
    <button class="chip" data-genre="뮤지컬" onclick="setGenre(this)">🎵 뮤지컬</button>
    <button class="chip" data-genre="클래식" onclick="setGenre(this)">🎻 클래식</button>
    <button class="chip" data-genre="국악" onclick="setGenre(this)">🥁 국악</button>
    <button class="chip" data-genre="무용" onclick="setGenre(this)">💃 무용</button>
    <button class="chip" data-status="공연중" onclick="setStatus(this)">🔴 공연중</button>
    <button class="chip" data-status="공연예정" onclick="setStatus(this)">🟡 예정</button>
  </div>
</header>

<div id="map">
  <div class="map-loading" id="mapLoading">
    <div class="loader-wrap">
      <div class="loader-ring"></div>
      <span class="loader-emoji">🎭</span>
    </div>
    <div class="loading-label">공연 정보 불러오는 중...</div>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="sheet-pill"></div>
  <div class="sheet-handle" onclick="toggleSheet()">
    <div class="sheet-title-row">
      <span class="sheet-title">공연 목록</span>
      <span class="count-pill" id="countPill">0</span>
    </div>
    <span class="chevron">▲</span>
  </div>
  <div class="perf-list" id="perfList"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API_URL = '/api/performances';

const GENRE_EMOJI = {
  '연극':'🎭','뮤지컬':'🎵','서양음악(클래식)':'🎻','클래식':'🎻',
  '한국음악(국악)':'🥁','국악':'🥁','무용(서양/한국무용)':'💃',
  '대중무용':'💃','무용':'💃','오페라':'🎤','대중음악':'🎸','서커스/마술':'🎪','복합':'✨'
};

const GENRE_COLOR = {
  '연극':'#f4a58a','뮤지컬':'#f0a0b0','클래식':'#b8a8d8','서양음악(클래식)':'#b8a8d8',
  '국악':'#f5d88a','한국음악(국악)':'#f5d88a','무용':'#8fcfb8','무용(서양/한국무용)':'#8fcfb8',
  '대중무용':'#8fcfb8','오페라':'#90c8e8','대중음악':'#90c8e8','default':'#f4a58a'
};

const FALLBACK=[
  {keys:['아르코'],lat:37.5824,lng:127.0018},{keys:['대학로예술'],lat:37.5820,lng:127.0025},
  {keys:['혜화동1번지'],lat:37.5836,lng:127.0013},{keys:['동숭아트'],lat:37.5815,lng:127.0030},
  {keys:['학전'],lat:37.5830,lng:127.0008},{keys:['예술공간 혜화'],lat:37.5845,lng:127.0022},
  {keys:['선돌'],lat:37.5808,lng:127.0040},{keys:['스튜디오76'],lat:37.5810,lng:127.0015},
  {keys:['홍익'],lat:37.5840,lng:127.0035},{keys:['마로니에'],lat:37.5826,lng:127.0020},
  {keys:['씨어터'],lat:37.5818,lng:127.0028},{keys:['산울림'],lat:37.5822,lng:127.0016},
  {keys:['게릴라'],lat:37.5812,lng:127.0032},{keys:['연우'],lat:37.5828,lng:127.0019},
  {keys:['대학로'],lat:37.5820,lng:127.0022},
];

const CENTER=[37.5825,127.0020];
let map, markers=[], allPerfs=[], filteredPerfs=[];
let currentGenre='전체', currentStatus=null;

// 날짜
const today=new Date();
document.getElementById('dateChip').textContent=`${today.getMonth()+1}월 ${today.getDate()}일`;

// Leaflet 지도 초기화
map = L.map('map',{center:CENTER,zoom:16,zoomControl:true});
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'© OpenStreetMap',maxZoom:19
}).addTo(map);

loadData();

async function loadData(){
  const btn=document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  document.getElementById('mapLoading').classList.remove('hidden');
  try{
    const res=await fetch(API_URL);
    const json=await res.json();
    if(json.success&&json.data?.length>0){
      allPerfs=json.data.map(p=>applyFallback(p));
      filteredPerfs=allPerfs;
      applyFilter();
      showToast(`🎭 ${allPerfs.length}개 공연!`);
    } else {
      showError();
    }
  }catch(e){showError();}
  finally{
    document.getElementById('mapLoading').classList.add('hidden');
    btn.classList.remove('spinning');
  }
}

function applyFallback(p){
  if(p.lat&&p.lng) return p;
  if(p.venue){
    for(const fb of FALLBACK){
      if(fb.keys.some(k=>p.venue.includes(k))) return{...p,lat:fb.lat,lng:fb.lng};
    }
  }
  return{...p,lat:CENTER[0]+(Math.random()-0.5)*0.006,lng:CENTER[1]+(Math.random()-0.5)*0.006};
}

function applyFilter(){
  filteredPerfs=allPerfs.filter(p=>{
    const g=currentGenre==='전체'||(p.genre||'').includes(currentGenre);
    const s=!currentStatus||p.status===currentStatus;
    return g&&s;
  });
  renderMarkers();
  renderList();
}

function renderMarkers(){
  markers.forEach(m=>map.removeLayer(m));
  markers=[];
  filteredPerfs.forEach((p,i)=>{
    const emoji=GENRE_EMOJI[p.genre]||'🎭';
    const color=GENRE_COLOR[p.genre]||GENRE_COLOR.default;
    const isOn=p.status==='공연중';
    const icon=L.divIcon({
      html:`<div style="background:${isOn?color:'#e8e0d8'};border:2.5px solid ${isOn?'white':'#c8b8a8'};border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 3px 12px rgba(0,0,0,0.15);cursor:pointer;">${emoji}</div>`,
      className:'',iconSize:[34,34],iconAnchor:[17,17]
    });
    const statusStyle=isOn
      ?'background:#dff3ec;color:#4a9a80;border:1px solid #b8e8d8'
      :'background:#fef6dc;color:#9a7800;border:1px solid #f0d880';
    const popup=`
      <div class="popup-name">${p.name}</div>
      <div class="popup-venue">📍 ${p.venue}</div>
      <div class="popup-date">${p.startDate} ~ ${p.endDate}</div>
      <span class="popup-status" style="${statusStyle}">${p.status}</span>
    `;
    const m=L.marker([p.lat,p.lng],{icon}).addTo(map).bindPopup(popup,{maxWidth:220});
    m.on('click',()=>highlightCard(i));
    markers.push(m);
  });
}

function renderList(){
  const list=document.getElementById('perfList');
  document.getElementById('countPill').textContent=filteredPerfs.length;
  if(!filteredPerfs.length){
    list.innerHTML='<div class="empty"><div class="empty-icon">🎭</div><div class="empty-text">해당하는 공연이 없어요</div></div>';
    return;
  }
  list.innerHTML=filteredPerfs.map((p,i)=>{
    const emoji=GENRE_EMOJI[p.genre]||'🎭';
    const isOn=p.status==='공연중';
    return`<div class="perf-card" id="card-${i}" onclick="focusPerf(${i})">
      <div class="perf-thumb">${p.poster?`<img src="${p.poster}" onerror="this.parentElement.innerHTML='${emoji}'" loading="lazy">`:emoji}</div>
      <div class="perf-body">
        <div class="perf-name">${p.name}</div>
        <div class="perf-venue">📍 ${p.venue}</div>
        <div class="perf-tags">
          <span class="tag tag-genre">${p.genre||'기타'}</span>
          <span class="tag ${isOn?'tag-ongoing':'tag-upcoming'}">${p.status}</span>
        </div>
        <div class="perf-date">${p.startDate} ~ ${p.endDate}</div>
      </div>
    </div>`;
  }).join('');
}

function focusPerf(i){
  map.setView([filteredPerfs[i].lat,filteredPerfs[i].lng],17);
  markers[i]?.openPopup();
  document.getElementById('sheet').classList.add('collapsed');
  highlightCard(i);
}

function highlightCard(i){
  document.querySelectorAll('.perf-card').forEach((el,j)=>el.classList.toggle('highlighted',j===i));
  document.getElementById(`card-${i}`)?.scrollIntoView({behavior:'smooth',block:'nearest'});
}

const CHIP_COLORS={'전체':'active-peach','연극':'active-peach','뮤지컬':'active-rose','클래식':'active-lavender','국악':'active-butter','무용':'active-mint','공연중':'active-mint','공연예정':'active-butter'};

function setGenre(btn){
  document.querySelectorAll('[data-genre]').forEach(b=>b.className='chip');
  btn.className=`chip ${CHIP_COLORS[btn.dataset.genre]||'active-peach'}`;
  currentGenre=btn.dataset.genre;
  applyFilter();
}

function setStatus(btn){
  if(currentStatus===btn.dataset.status){btn.className='chip';currentStatus=null;}
  else{document.querySelectorAll('[data-status]').forEach(b=>b.className='chip');btn.className=`chip ${CHIP_COLORS[btn.dataset.status]||'active-mint'}`;currentStatus=btn.dataset.status;}
  applyFilter();
}

function toggleSheet(){document.getElementById('sheet').classList.toggle('collapsed')}

function showError(){
  document.getElementById('perfList').innerHTML='<div class="empty"><div class="empty-icon">😢</div><div class="empty-text">공연 정보를 불러오지 못했어요<br>↻ 버튼을 눌러 다시 시도해보세요</div></div>';
  document.getElementById('countPill').textContent='0';
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}
</script>
</body>
</html>
